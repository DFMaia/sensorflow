spring:
  application:
    name: sensor-service
  datasource:
    url: jdbc:mysql://localhost:3306/sensordb
    username: sensor_app
    password: ${SENSOR_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC